<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — HN Properties</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root { --brand: #1583b5; --ink: #10233c; --paper: #f4f7fa; --muted: #64748b; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: var(--paper); color: var(--ink); padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        background: #fff; border-radius: 16px; padding: 32px 28px; max-width: 380px;
        text-align: center; box-shadow: 0 10px 30px -12px rgba(16, 35, 60, 0.18);
      }
      img { width: 64px; height: 64px; object-fit: contain; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin: 0 0 20px; }
      button {
        background: var(--brand); color: #fff; border: 0; border-radius: 10px;
        padding: 12px 22px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
      }
      button:active { transform: translateY(1px); }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon.png" alt="" />
      <h1>You're offline</h1>
      <p>
        We can't reach HN Properties right now. Pages you've already opened will
        still work — check your connection and try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
